name: Validate agent settings

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile scripts
        run: python -m py_compile scripts/*.py
      - name: Run tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Scan for secrets
        run: python scripts/check-secrets.py
      - name: Validate shared-skill deduplication and installer
        run: python scripts/install.py
      - name: Check whitespace
        run: git diff --check
