model = "gpt-5.6-sol"
model_reasoning_effort = "high"
model_context_window = 900_000
model_auto_compact_token_limit = "${MCP_MODEL_AUTO_COMPACT_TOKEN_LIMIT}"
notify = [
  "~/.codex/computer-use/Codex Computer Use.app/Contents/SharedSupport/SkyComputerUseClient.app/Contents/MacOS/SkyComputerUseClient",
  "turn-ended",
]
personality = "pragmatic"
service_tier = "default"

[desktop]
followUpQueueMode = "queue"
conversationDetailMode = "STEPS_COMMANDS"

[features]
js_repl = false
hooks = true

# Keep all user-level hook definitions in this file. Using hooks.json at the
# same time causes Codex to load two representations and emit a warning.
[[hooks.SessionStart]]
matcher = "startup|resume|clear|compact"

[[hooks.SessionStart.hooks]]
command = 'echo "Code discovery: prefer codebase-memory-mcp (search_graph, trace_path, get_code_snippet, query_graph, search_code) over grep/file-read; run index_repository first if the project is not indexed."'
type = "command"

[[hooks.SessionStart]]

[[hooks.SessionStart.hooks]]
type = "command"
command = '''bash '~/.codex/herdr-agent-state.sh' session'''
timeout = 10

[hooks.state]

[hooks.state."~/.codex/config.toml:session_start:0:0"]
enabled = true
trusted_hash = "sha256:ed997f3f9766959ba56dc2243cd02468d6eadad80d92b7f5a650e6fc0fb0c050"

[hooks.state."~/.codex/config.toml:session_start:1:0"]
trusted_hash = "sha256:359d176cb8711411d1c06ac3fa4758864130624d7f00a51d94d21e3ece8aae14"

[marketplaces.openai-bundled]
source_type = "local"
source = "~/.codex/.tmp/bundled-marketplaces/openai-bundled"

[marketplaces.openai-primary-runtime]
source_type = "local"
source = "~/.cache/codex-runtimes/codex-primary-runtime/plugins/openai-primary-runtime"

[mcp_servers.codebase-memory-mcp]
command = "~/.local/bin/codebase-memory-mcp"

[mcp_servers.computer-use]
args = ["mcp"]
command = "./Codex Computer Use.app/Contents/SharedSupport/SkyComputerUseClient.app/Contents/MacOS/SkyComputerUseClient"
cwd = "."
enabled = false

[mcp_servers.heroui-native]
args = ["-y", "@heroui/native-mcp@latest"]
command = "npx"

[mcp_servers.heroui-native-pro]
url = "https://native-mcp.heroui.pro/mcp"

[mcp_servers.heroui-native-pro.http_headers]
x-heroui-personal-token = "${HEROUI_NATIVE_PRO_HEROUI_PERSONAL_TOKEN}"

[mcp_servers.heroui-pro]
url = "https://mcp.heroui.pro/mcp"

[mcp_servers.heroui-pro.http_headers]
x-heroui-personal-token = "${HEROUI_PRO_HEROUI_PERSONAL_TOKEN}"

[mcp_servers.heroui-react]
args = ["-y", "@heroui/react-mcp@latest"]
command = "npx"

[mcp_servers.node_repl]
args = []
command = "/Applications/ChatGPT.app/Contents/Resources/cua_node/bin/node_repl"
startup_timeout_sec = 120

[mcp_servers.node_repl.env]
NODE_REPL_NATIVE_PIPE_CONNECT_TIMEOUT_MS = "1000"
NODE_REPL_NODE_MODULE_DIRS = "/Applications/ChatGPT.app/Contents/Resources/cua_node/lib/node_modules"
NODE_REPL_NODE_PATH = "/Applications/ChatGPT.app/Contents/Resources/cua_node/bin/node"
NODE_REPL_TRUSTED_CODE_PATHS = "~/.codex:/Applications/ChatGPT.app/Contents/Resources/cua_node/lib/node_modules"
CODEX_HOME = "~/.codex"
BROWSER_USE_AVAILABLE_BACKENDS = "chrome,iab"
BROWSER_USE_TINYSKY_ENABLED = "1"
NODE_REPL_INSTRUCTIONS_USE_CASE_BROWSER = ""
NODE_REPL_INSTRUCTIONS_USE_CASE_CHROME = ""
NODE_REPL_INSTRUCTIONS_USE_CASE_COMPUTER_USE = ""
BROWSER_USE_CODEX_APP_BUILD_FLAVOR = "prod"
BROWSER_USE_CODEX_APP_VERSION = "26.901.22334"
NODE_REPL_TRUSTED_SERVICES = '{"browser":"~/.codex/plugins/cache/openai-bundled/browser/26.901.22334/scripts/browser-service.mjs","sky":"@oai/sky/service"}'
SKY_CUA_SERVICE_PATH = "~/.codex/computer-use/Codex Computer Use.app"
CODEX_CLI_PATH = "/Applications/ChatGPT.app/Contents/Resources/codex"

[mcp_servers.vgpu]
type = "http"
url = "https://vgpu.sh/api/mcp"
enabled = false

[mcp_servers.chia_personal_site]
url = "https://service.chia1104.dev/api/v1/mcp"
http_headers = { "x-ch-api-key" = "", "x-cf-bypass-token" = "" }

[notice.model_migrations]
"gpt-5.3-codex" = "gpt-5.4"

[plugins."auth@plugins-cli"]
enabled = true

[plugins."browser@openai-bundled"]
enabled = true

[plugins."computer-use@openai-bundled"]
enabled = true

[plugins."documents@openai-primary-runtime"]
enabled = true

[plugins."pdf@openai-primary-runtime"]
enabled = true

[plugins."presentations@openai-primary-runtime"]
enabled = true

[plugins."sites@openai-bundled"]
